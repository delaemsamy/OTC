<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Демо-терминал — бинарные опционы</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0E1420;
  --panel:#141B2B;
  --panel-2:#1B2436;
  --border:#232C40;
  --text:#E8ECF5;
  --text-dim:#7C8AA3;
  --buy:#17C787;
  --sell:#F1495B;
  --accent:#2F7BF6;
  --gold:#D9B24C;
  --mono:'JetBrains Mono', monospace;
  --body:'Inter', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:var(--body);
  display:flex; flex-direction:column; overflow:hidden;
}
button{font-family:inherit; cursor:pointer;}
input{font-family:inherit;}

.demo-flag{
  background:var(--gold); color:#1A1508; font-family:var(--mono); font-weight:700;
  font-size:11px; text-align:center; padding:5px; letter-spacing:0.03em; flex-shrink:0;
}

/* ---------- TOP BAR ---------- */
.topbar{
  height:54px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; border-bottom:1px solid var(--border); background:var(--panel); position:relative; z-index:20;
}
.instrument-select{
  display:flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--border);
  border-radius:6px; padding:8px 12px; font-family:var(--mono); font-size:14px; font-weight:700;
}
.instrument-select .badge{
  font-size:9px; font-weight:700; padding:2px 6px; border-radius:8px; letter-spacing:0.03em;
}
.instrument-select .badge.live{background:rgba(23,199,135,0.15); color:var(--buy);}
.instrument-select .badge.otc{background:rgba(217,178,76,0.15); color:var(--gold);}
.instrument-select .caret{color:var(--text-dim); font-size:10px;}

.topbar-right{display:flex; align-items:center; gap:20px;}
.clock{font-family:var(--mono); font-size:13px; color:var(--text-dim); text-align:right;}
.clock b{display:block; color:var(--text); font-size:15px;}
.balance-display{font-family:var(--mono); text-align:right;}
.balance-display .lbl{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em;}
.balance-display .val{font-size:16px; font-weight:800;}
.reset-icon{
  background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:6px;
  width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:15px;
}
.reset-icon:hover{border-color:var(--sell); color:var(--sell);}

/* ---------- INSTRUMENT DROPDOWN ---------- */
.instrument-dropdown{
  position:absolute; top:54px; left:16px; width:280px; background:var(--panel);
  border:1px solid var(--border); border-radius:8px; box-shadow:0 12px 30px rgba(0,0,0,0.4);
  padding:6px; display:none; max-height:70vh; overflow-y:auto; z-index:30;
}
.instrument-dropdown.open{display:block;}
.instrument-option{
  display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:6px;
  font-family:var(--mono); font-size:13px; color:var(--text-dim);
}
.instrument-option:hover{background:var(--panel-2); color:var(--text); cursor:pointer;}
.instrument-option.current{color:var(--text); background:rgba(47,123,246,0.1);}

/* ---------- MAIN LAYOUT ---------- */
.main{flex:1; display:flex; overflow:hidden;}
.chart-area{flex:1; position:relative; display:flex; flex-direction:column; min-width:0;}
.chart-svg-wrap{flex:1; position:relative;}
svg#chart{width:100%; height:100%; display:block;}

.ohlc-readout{
  position:absolute; left:14px; bottom:14px; font-family:var(--mono); font-size:11.5px;
  color:var(--text-dim); line-height:1.6; background:rgba(20,27,43,0.75); padding:8px 12px; border-radius:6px;
}
.ohlc-readout b{color:var(--text);}

.zoom-controls{
  position:absolute; right:14px; top:14px; display:flex; flex-direction:column; gap:4px; z-index:5;
}
.zoom-btn{
  width:30px; height:30px; border-radius:6px; background:rgba(20,27,43,0.85); border:1px solid var(--border);
  color:var(--text); font-size:16px; font-family:var(--mono); display:flex; align-items:center; justify-content:center;
}
.zoom-btn:hover{border-color:var(--accent); color:var(--accent);}
.zoom-btn:disabled{opacity:0.3; cursor:default;}
.zoom-btn:disabled:hover{border-color:var(--border); color:var(--text);}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:300px; flex-shrink:0; background:var(--panel); border-left:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
.sidebar-top{padding:18px; border-bottom:1px solid var(--border);}
.field-label{font-family:var(--mono); font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px;}
.stake-field{
  display:flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--border);
  border-radius:6px; padding:4px;
}
.stake-field button{
  background:none; border:none; color:var(--text-dim); font-size:18px; width:32px; height:32px; border-radius:4px;
}
.stake-field button:hover{background:rgba(255,255,255,0.05); color:var(--text);}
.stake-field input{
  flex:1; background:none; border:none; color:var(--text); font-family:var(--mono); font-size:16px;
  text-align:center; font-weight:700; outline:none;
}
.payout-box{margin-top:16px; display:flex; justify-content:space-between; align-items:center;}
.payout-box .lbl{font-family:var(--mono); font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em;}
.payout-box .pct{font-family:var(--mono); font-size:15px; font-weight:800; color:var(--buy);}
.payout-box .amt{font-family:var(--mono); font-size:12px; color:var(--text-dim);}

.trade-buttons{margin-top:16px; display:flex; flex-direction:column; gap:8px;}
.btn-buy, .btn-sell{
  border:none; border-radius:6px; padding:16px; font-family:var(--mono); font-weight:800; font-size:14px;
  color:#08150F; display:flex; align-items:center; justify-content:center; gap:8px; transition:opacity .15s, transform .1s;
}
.btn-buy{background:var(--buy);}
.btn-sell{background:var(--sell); color:#1A0507;}
.btn-buy:hover, .btn-sell:hover{opacity:0.88;}
.btn-buy:active, .btn-sell:active{transform:scale(0.98);}

/* ---------- TABS ---------- */
.tabs{display:flex; border-bottom:1px solid var(--border); flex-shrink:0;}
.tab-btn{
  flex:1; background:none; border:none; color:var(--text-dim); font-family:var(--mono); font-size:12.5px;
  padding:14px 0; border-bottom:2px solid transparent;
}
.tab-btn.active{color:var(--text); border-bottom-color:var(--accent);}
.tab-panel{flex:1; overflow-y:auto; padding:10px 14px;}
.tab-panel.hidden{display:none;}
.empty-note{color:var(--text-dim); font-family:var(--mono); font-size:12.5px; text-align:center; padding:30px 10px;}

.trade-card{
  background:var(--panel-2); border:1px solid var(--border); border-radius:6px; padding:12px; margin-bottom:8px;
  font-family:var(--mono); font-size:12px;
}
.trade-card .row1{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.trade-card .instr{font-weight:700;}
.trade-card .dir{display:flex; align-items:center; gap:4px;}
.trade-card .dir.up{color:var(--buy);}
.trade-card .dir.down{color:var(--sell);}
.trade-card .row2{display:flex; justify-content:space-between; color:var(--text-dim);}
.trade-card .timer{color:var(--gold); font-weight:700;}
.trade-card.win{border-color:rgba(23,199,135,0.4);}
.trade-card.lose{border-color:rgba(241,73,91,0.4);}
.trade-card .result{font-weight:700;}
.trade-card.win .result{color:var(--buy);}
.trade-card.lose .result{color:var(--sell);}

/* ---------- RESPONSIVE ---------- */
@media (max-width:820px){
  .main{flex-direction:column;}
  .sidebar{width:100%; border-left:none; border-top:1px solid var(--border); max-height:46vh;}
  .chart-area{min-height:40vh;}
  .clock{display:none;}
}
</style>
</head>
<body>

<div class="demo-flag">⚠ ДЕМО-СЧЁТ — ВИРТУАЛЬНЫЙ БАЛАНС. BTC — РЕАЛЬНАЯ ЦЕНА, OTC-ПАРЫ — СИМУЛЯЦИЯ. РЕАЛЬНЫЕ ДЕНЬГИ НЕ ЗАДЕЙСТВОВАНЫ</div>

<div class="topbar">
  <div style="position:relative;">
    <div class="instrument-select" id="instrumentSelect">
      <span id="pairLabel">BTC/USDT</span>
      <span class="badge live" id="pairBadge">LIVE</span>
      <span class="caret">▾</span>
    </div>
    <div class="instrument-dropdown" id="instrumentDropdown"></div>
  </div>
  <div class="topbar-right">
    <div class="clock"><span id="clockLabel">Время</span><b id="clockVal">—</b></div>
    <div class="balance-display">
      <div class="lbl">Баланс</div>
      <div class="val" id="balanceVal">$10,000.00</div>
    </div>
    <button class="reset-icon" id="resetBtn" title="Сбросить баланс">⟲</button>
  </div>
</div>

<div class="main">
  <div class="chart-area">
    <div class="chart-svg-wrap" id="chartWrap">
      <svg id="chart" viewBox="0 0 1000 560" preserveAspectRatio="none"></svg>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomIn" title="Крупнее свечи">+</button>
        <button class="zoom-btn" id="zoomOut" title="Мельче свечи">−</button>
      </div>
    </div>
    <div class="ohlc-readout" id="ohlcReadout"></div>
  </div>

  <div class="sidebar">
    <div class="sidebar-top">
      <div class="field-label">Сумма</div>
      <div class="stake-field">
        <button id="stakeMinus">−</button>
        <input type="number" id="stakeInput" value="100" min="1" step="10">
        <button id="stakePlus">+</button>
      </div>
      <div class="payout-box">
        <div>
          <div class="lbl">Выплата</div>
          <div class="pct">+85%</div>
        </div>
        <div class="amt" id="payoutAmt">+$85.00</div>
      </div>
      <div class="trade-buttons">
        <button class="btn-buy" id="btnUp">▲ КУПИТЬ</button>
        <button class="btn-sell" id="btnDown">▼ ПРОДАТЬ</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="open" id="tabOpenBtn">Открытые</button>
      <button class="tab-btn" data-tab="closed" id="tabClosedBtn">Закрытые</button>
    </div>
    <div class="tab-panel" id="tabOpen"><div class="empty-note">Нет открытых сделок</div></div>
    <div class="tab-panel hidden" id="tabClosed"><div class="empty-note">Сделок пока не было</div></div>
  </div>
</div>

<script>
const OPTION_DURATION = 60;
const PAYOUT = 0.85;
const CANDLE_INTERVAL = 5000;
const MAX_CANDLES = 200; // сколько свечей вообще храним в памяти
const MIN_VISIBLE = 10;  // минимум свечей на экране (максимальный зум)
const MAX_VISIBLE = 120; // максимум свечей на экране (минимальный зум)
let visibleCount = 40;   // сколько свечей показываем сейчас
const STORAGE_BALANCE = 'demoOptionsBalance';
const STORAGE_HISTORY = 'demoOptionsHistory';

const INSTRUMENTS = [
  { id: 'BTCUSDT',    label: 'BTC/USDT',    type: 'live', decimals: 2 },
  { id: 'EURUSD_OTC', label: 'EUR/USD OTC', type: 'otc', base: 1.0723, vol: 0.00035, decimals: 5 },
  { id: 'GBPUSD_OTC', label: 'GBP/USD OTC', type: 'otc', base: 1.2685, vol: 0.00045, decimals: 5 },
  { id: 'USDJPY_OTC', label: 'USD/JPY OTC', type: 'otc', base: 149.52, vol: 0.045,   decimals: 3 },
  { id: 'AUDUSD_OTC', label: 'AUD/USD OTC', type: 'otc', base: 0.6521, vol: 0.00035, decimals: 5 },
  { id: 'USDCHF_OTC', label: 'USD/CHF OTC', type: 'otc', base: 0.8843, vol: 0.00030, decimals: 5 },
  { id: 'EURJPY_OTC', label: 'EUR/JPY OTC', type: 'otc', base: 160.35, vol: 0.055,   decimals: 3 },
  { id: 'GBPJPY_OTC', label: 'GBP/JPY OTC', type: 'otc', base: 189.72, vol: 0.065,   decimals: 3 },
  { id: 'USDCAD_OTC', label: 'USD/CAD OTC', type: 'otc', base: 1.3712, vol: 0.00035, decimals: 5 },
  { id: 'NZDUSD_OTC', label: 'NZD/USD OTC', type: 'otc', base: 0.6015, vol: 0.00035, decimals: 5 },
  { id: 'EURGBP_OTC', label: 'EUR/GBP OTC', type: 'otc', base: 0.8452, vol: 0.00025, decimals: 5 },
];

let currentId = INSTRUMENTS[0].id;
const state = {};
INSTRUMENTS.forEach(ins => {
  state[ins.id] = { candles: [], currentPrice: ins.type === 'otc' ? ins.base : null, prevPrice: null, rangeMin: null, rangeMax: null };
});

let balance = parseFloat(localStorage.getItem(STORAGE_BALANCE)) || 10000;
let closedHistory = JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '[]');
let openTrades = []; // { id, instrumentId, instrumentLabel, direction, stake, startPrice, startTime, endTime, decimals }
let tradeSeq = 1;

const els = {
  pairLabel: document.getElementById('pairLabel'),
  pairBadge: document.getElementById('pairBadge'),
  instrumentSelect: document.getElementById('instrumentSelect'),
  instrumentDropdown: document.getElementById('instrumentDropdown'),
  balanceVal: document.getElementById('balanceVal'),
  clockVal: document.getElementById('clockVal'),
  chart: document.getElementById('chart'),
  ohlc: document.getElementById('ohlcReadout'),
  stakeInput: document.getElementById('stakeInput'),
  payoutAmt: document.getElementById('payoutAmt'),
  btnUp: document.getElementById('btnUp'),
  btnDown: document.getElementById('btnDown'),
  tabOpenBtn: document.getElementById('tabOpenBtn'),
  tabClosedBtn: document.getElementById('tabClosedBtn'),
  tabOpen: document.getElementById('tabOpen'),
  tabClosed: document.getElementById('tabClosed'),
  resetBtn: document.getElementById('resetBtn'),
  chartWrap: document.getElementById('chartWrap'),
  zoomIn: document.getElementById('zoomIn'),
  zoomOut: document.getElementById('zoomOut'),
};

function getInstrument(id){ return INSTRUMENTS.find(i => i.id === id); }
function fmtPrice(price, ins){ return price.toLocaleString('en-US', { minimumFractionDigits: ins.decimals, maximumFractionDigits: ins.decimals }); }
function fmtUsd(n){ return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function saveState(){
  localStorage.setItem(STORAGE_BALANCE, balance);
  localStorage.setItem(STORAGE_HISTORY, JSON.stringify(closedHistory.slice(-80)));
}
function renderBalance(){ els.balanceVal.textContent = fmtUsd(balance); }

// ---------- Часы ----------
function tickClock(){
  els.clockVal.textContent = new Date().toLocaleTimeString('ru-RU');
}
setInterval(tickClock, 1000);
tickClock();

// ---------- Выбор инструмента ----------
function renderDropdown(){
  els.instrumentDropdown.innerHTML = INSTRUMENTS.map(ins => `
    <div class="instrument-option ${ins.id === currentId ? 'current' : ''}" data-id="${ins.id}">
      <span>${ins.label}</span>
      <span class="badge ${ins.type}">${ins.type === 'live' ? 'LIVE' : 'OTC'}</span>
    </div>
  `).join('');
  els.instrumentDropdown.querySelectorAll('.instrument-option').forEach(opt => {
    opt.addEventListener('click', () => { switchInstrument(opt.dataset.id); closeDropdown(); });
  });
}
function openDropdown(){ els.instrumentDropdown.classList.add('open'); }
function closeDropdown(){ els.instrumentDropdown.classList.remove('open'); }
els.instrumentSelect.addEventListener('click', (e) => {
  e.stopPropagation();
  els.instrumentDropdown.classList.contains('open') ? closeDropdown() : openDropdown();
});
document.addEventListener('click', closeDropdown);

function switchInstrument(id){
  currentId = id;
  const ins = getInstrument(id);
  state[id].rangeMin = null;
  state[id].rangeMax = null;
  els.pairLabel.textContent = ins.label;
  els.pairBadge.textContent = ins.type === 'live' ? 'LIVE' : 'OTC';
  els.pairBadge.className = 'badge ' + ins.type;
  renderDropdown();
  renderCandles();
  renderOhlc();
}

// ---------- Свечи ----------
function updateCandle(id, time, price){
  const s = state[id];
  const bucket = Math.floor(time / CANDLE_INTERVAL) * CANDLE_INTERVAL;
  let last = s.candles[s.candles.length - 1];
  if(!last || last.time !== bucket){
    last = { time: bucket, open: price, high: price, low: price, close: price };
    s.candles.push(last);
    if(s.candles.length > MAX_CANDLES) s.candles.shift();
  }else{
    last.high = Math.max(last.high, price);
    last.low = Math.min(last.low, price);
    last.close = price;
  }
}

function renderOhlc(){
  const ins = getInstrument(currentId);
  const s = state[currentId];
  const last = s.candles[s.candles.length - 1];
  if(!last){ els.ohlc.innerHTML = ''; return; }
  els.ohlc.innerHTML =
    `Открытие: <b>${fmtPrice(last.open, ins)}</b> · Закрытие: <b>${fmtPrice(last.close, ins)}</b><br>` +
    `Максимум: <b>${fmtPrice(last.high, ins)}</b> · Минимум: <b>${fmtPrice(last.low, ins)}</b>`;
}

function renderCandles(){
  const ins = getInstrument(currentId);
  const s = state[currentId];
  const candles = s.candles.slice(-visibleCount);
  if(!candles.length){ els.chart.innerHTML = ''; return; }

  const w = 1000, h = 560, padX = 10, padY = 30;
  const highs = candles.map(c => c.high), lows = candles.map(c => c.low);
  const rawMin = Math.min(...lows), rawMax = Math.max(...highs);

  // Границы шкалы пересчитываем только когда цена реально выходит за текущий
  // диапазон — так шкала не "прыгает" на каждом мелком колебании цены.
  if(s.rangeMin === null || rawMin < s.rangeMin || rawMax > s.rangeMax){
    const rawRange = (rawMax - rawMin) || (rawMax * 0.002) || 0.0001;
    const pad = rawRange * 0.18;
    s.rangeMin = rawMin - pad;
    s.rangeMax = rawMax + pad;
  }

  const min = s.rangeMin, max = s.rangeMax;
  const range = (max - min) || 1;

  const slot = (w - padX * 2) / candles.length;
  const bodyWidth = Math.max(2, slot * 0.6);
  const yFor = price => padY + (h - padY * 2) - ((price - min) / range) * (h - padY * 2);

  let svg = '';

  openTrades.filter(t => t.instrumentId === currentId).forEach(t => {
    const bucket = Math.floor(t.startTime / CANDLE_INTERVAL) * CANDLE_INTERVAL;
    const idx = candles.findIndex(c => c.time === bucket);
    if(idx >= 0){
      const x = padX + slot * idx + slot / 2;
      svg += `<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${h}" stroke="#D9B24C" stroke-width="1" stroke-dasharray="4 4"/>`;
    }
  });

  candles.forEach((c, i) => {
    const xCenter = padX + slot * i + slot / 2;
    const up = c.close >= c.open;
    const color = up ? '#17C787' : '#F1495B';
    const yHigh = yFor(c.high), yLow = yFor(c.low);
    const yOpen = yFor(c.open), yClose = yFor(c.close);
    const bodyTop = Math.min(yOpen, yClose);
    const bodyHeight = Math.max(1.5, Math.abs(yClose - yOpen));
    svg +=
      `<line x1="${xCenter.toFixed(1)}" y1="${yHigh.toFixed(1)}" x2="${xCenter.toFixed(1)}" y2="${yLow.toFixed(1)}" stroke="${color}" stroke-width="1"/>` +
      `<rect x="${(xCenter - bodyWidth/2).toFixed(1)}" y="${bodyTop.toFixed(1)}" width="${bodyWidth.toFixed(1)}" height="${bodyHeight.toFixed(1)}" fill="${color}"/>`;
  });

  if(s.currentPrice !== null){
    const y = yFor(s.currentPrice);
    svg += `<line x1="0" y1="${y.toFixed(1)}" x2="${w}" y2="${y.toFixed(1)}" stroke="#7C8AA3" stroke-width="1" stroke-dasharray="3 5" opacity="0.5"/>`;
  }

  els.chart.innerHTML = svg;
}

// ---------- Цены: живой BTC + симуляция OTC ----------
async function pollLivePrice(){
  try{
    const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
    const data = await res.json();
    pushPrice('BTCUSDT', parseFloat(data.price));
  }catch(err){ /* тихо пропускаем сбой одного тика */ }
}
function stepOtcPrice(ins, prevPrice){
  const meanReversion = (ins.base - prevPrice) * 0.01;
  const noise = (Math.random() - 0.5) * ins.vol;
  return Math.max(0.00001, prevPrice + meanReversion + noise);
}
function tickOtcPrices(){
  INSTRUMENTS.filter(i => i.type === 'otc').forEach(ins => {
    const s = state[ins.id];
    const prev = s.currentPrice ?? ins.base;
    pushPrice(ins.id, stepOtcPrice(ins, prev));
  });
}
function pushPrice(id, price){
  const s = state[id];
  const now = Date.now();
  s.prevPrice = s.currentPrice;
  s.currentPrice = price;
  updateCandle(id, now, price);

  settleDueTrades(id, now);

  if(id === currentId){
    renderCandles();
    renderOhlc();
  }
}
setInterval(() => { pollLivePrice(); tickOtcPrices(); }, 2000);
pollLivePrice();
tickOtcPrices();

// ---------- Сделки ----------
function updatePayoutPreview(){
  const stake = parseFloat(els.stakeInput.value) || 0;
  els.payoutAmt.textContent = '+' + fmtUsd(stake * PAYOUT);
}
els.stakeInput.addEventListener('input', updatePayoutPreview);
document.getElementById('stakeMinus').addEventListener('click', () => {
  els.stakeInput.value = Math.max(1, (parseFloat(els.stakeInput.value) || 0) - 10);
  updatePayoutPreview();
});
document.getElementById('stakePlus').addEventListener('click', () => {
  els.stakeInput.value = (parseFloat(els.stakeInput.value) || 0) + 10;
  updatePayoutPreview();
});

function openTrade(direction){
  const s = state[currentId];
  const ins = getInstrument(currentId);
  if(s.currentPrice === null) return;
  const stake = parseFloat(els.stakeInput.value);
  if(!stake || stake <= 0 || stake > balance){
    alert('Проверьте сумму ставки — она должна быть больше 0 и не больше вашего баланса.');
    return;
  }

  const trade = {
    id: tradeSeq++,
    instrumentId: currentId,
    instrumentLabel: ins.label,
    direction,
    stake,
    decimals: ins.decimals,
    startPrice: s.currentPrice,
    startTime: Date.now(),
    endTime: Date.now() + OPTION_DURATION * 1000,
  };
  openTrades.push(trade);
  balance -= stake;
  renderBalance();
  saveState();
  renderCandles();
  renderOpenTab();
}

function settleDueTrades(instrumentId, now){
  const due = openTrades.filter(t => t.instrumentId === instrumentId && now >= t.endTime);
  if(!due.length) return;
  due.forEach(t => settleTrade(t));
  openTrades = openTrades.filter(t => !due.includes(t));
  renderOpenTab();
  renderClosedTab();
  if(instrumentId === currentId) renderCandles();
}

function settleTrade(t){
  const finalPrice = state[t.instrumentId].currentPrice;
  const win = t.direction === 'up' ? finalPrice > t.startPrice : finalPrice < t.startPrice;
  if(win) balance += t.stake + t.stake * PAYOUT;
  closedHistory.push({
    instrumentLabel: t.instrumentLabel, direction: t.direction, stake: t.stake,
    win, time: Date.now(), balanceAfter: balance,
  });
  renderBalance();
  saveState();
}

function renderOpenTab(){
  if(!openTrades.length){
    els.tabOpen.innerHTML = '<div class="empty-note">Нет открытых сделок</div>';
    return;
  }
  els.tabOpen.innerHTML = openTrades.slice().reverse().map(t => {
    const remaining = Math.max(0, Math.ceil((t.endTime - Date.now()) / 1000));
    return `
      <div class="trade-card" data-trade-id="${t.id}">
        <div class="row1">
          <span class="instr">${t.instrumentLabel}</span>
          <span class="dir ${t.direction}">${t.direction === 'up' ? '▲ Вверх' : '▼ Вниз'}</span>
        </div>
        <div class="row2">
          <span>Ставка ${fmtUsd(t.stake)}</span>
          <span class="timer">${remaining}с</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderClosedTab(){
  if(!closedHistory.length){
    els.tabClosed.innerHTML = '<div class="empty-note">Сделок пока не было</div>';
    return;
  }
  els.tabClosed.innerHTML = closedHistory.slice().reverse().slice(0, 40).map(t => `
    <div class="trade-card ${t.win ? 'win' : 'lose'}">
      <div class="row1">
        <span class="instr">${t.instrumentLabel}</span>
        <span class="dir ${t.direction}">${t.direction === 'up' ? '▲ Вверх' : '▼ Вниз'}</span>
      </div>
      <div class="row2">
        <span>${new Date(t.time).toLocaleTimeString('ru-RU')}</span>
        <span class="result">${t.win ? '+' + fmtUsd(t.stake * PAYOUT) : '−' + fmtUsd(t.stake)}</span>
      </div>
    </div>
  `).join('');
}

setInterval(renderOpenTab, 1000);

// ---------- Зум графика ----------
function applyZoom(delta){
  visibleCount = Math.min(MAX_VISIBLE, Math.max(MIN_VISIBLE, visibleCount + delta));
  els.zoomIn.disabled = visibleCount <= MIN_VISIBLE;
  els.zoomOut.disabled = visibleCount >= MAX_VISIBLE;
  state[currentId].rangeMin = null;
  state[currentId].rangeMax = null;
  renderCandles();
}
els.zoomIn.addEventListener('click', () => applyZoom(-5));   // меньше свечей = крупнее
els.zoomOut.addEventListener('click', () => applyZoom(5));   // больше свечей = мельче
els.chartWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  applyZoom(e.deltaY > 0 ? 5 : -5);
}, { passive: false });

els.btnUp.addEventListener('click', () => openTrade('up'));
els.btnDown.addEventListener('click', () => openTrade('down'));

els.tabOpenBtn.addEventListener('click', () => {
  els.tabOpenBtn.classList.add('active'); els.tabClosedBtn.classList.remove('active');
  els.tabOpen.classList.remove('hidden'); els.tabClosed.classList.add('hidden');
});
els.tabClosedBtn.addEventListener('click', () => {
  els.tabClosedBtn.classList.add('active'); els.tabOpenBtn.classList.remove('active');
  els.tabClosed.classList.remove('hidden'); els.tabOpen.classList.add('hidden');
});

els.resetBtn.addEventListener('click', () => {
  if(!confirm('Сбросить виртуальный баланс до $10,000 и очистить историю сделок? Открытые сделки будут закрыты без выплаты.')) return;
  balance = 10000;
  closedHistory = [];
  openTrades = [];
  saveState();
  renderBalance();
  renderOpenTab();
  renderClosedTab();
  renderCandles();
});

renderDropdown();
renderBalance();
renderOpenTab();
renderClosedTab();
updatePayoutPreview();
</script>
</body>
</html>
